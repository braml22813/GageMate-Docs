site_name: GageMate Documentation
site_description: Installation, security, and user documentation for GageMate
site_url: https://braml22813.github.io/GageMate-Docs/
repo_url: https://github.com/braml22813/GageMate-Docs
repo_name: GageMate-Docs
theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
nav:
  - Home: index.md
  - Installation: installation.md
  - System Requirements: system-requirements.md
  - Corporate IT & Security: corporate-it-security.md
  - Getting Started: getting-started.md
  - Troubleshooting: troubleshooting.md
  - Licensing & Disclaimers: licensing.md
